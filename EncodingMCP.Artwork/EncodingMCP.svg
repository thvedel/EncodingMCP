<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">

  <defs>
    <linearGradient id="mcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- MCP Hexagon -->
  <polygon
    points="128,28 198,68 198,148 128,188 58,148 58,68"
    fill="url(#mcp)"
    stroke="#1e3a8a"
    stroke-width="4"/>

  <!-- UTF-8 Center -->
  <circle
    cx="128"
    cy="108"
    r="42"
    fill="white"
    opacity="0.95"/>

  <text
    x="128"
    y="115"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="22"
    font-weight="700"
    fill="#2563eb">
    UTF-8
  </text>

  <!-- Incoming arrow -->
  <path
    d="M22 108 H66"
    stroke="#f59e0b"
    stroke-width="8"
    fill="none"
    stroke-linecap="round"/>

  <path
    d="M55 98 L70 108 L55 118"
    stroke="#f59e0b"
    stroke-width="8"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Outgoing arrow -->
  <path
    d="M190 108 H234"
    stroke="#10b981"
    stroke-width="8"
    fill="none"
    stroke-linecap="round"/>

  <path
    d="M219 98 L234 108 L219 118"
    stroke="#10b981"
    stroke-width="8"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Encodings -->
  <text x="128" y="16"
        text-anchor="middle"
        font-family="Consolas, monospace"
        font-size="12"
        fill="#374151">
    UTF-16
  </text>

  <text x="210" y="60"
        text-anchor="middle"
        font-family="Consolas, monospace"
        font-size="11"
        fill="#374151">
    Shift-JIS
  </text>

  <text x="210" y="200"
        text-anchor="middle"
        font-family="Consolas, monospace"
        font-size="11"
        fill="#374151">
    CP1252
  </text>

  <text x="46" y="200"
        text-anchor="middle"
        font-family="Consolas, monospace"
        font-size="11"
        fill="#374151">
    ISO-8859-1
  </text>

  <text x="46" y="60"
        text-anchor="middle"
        font-family="Consolas, monospace"
        font-size="11"
        fill="#374151">
    Big5
  </text>

  <!-- MCP label -->
  <text
    x="128"
    y="230"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="18"
    font-weight="600"
    fill="#1f2937">
    MCP
  </text>

</svg>